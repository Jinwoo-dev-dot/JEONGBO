<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>분할정복 동적계획 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#ffffff;--fg:#26241f;--mute:#85817a;--line:#ebe9e3;--card:#f5f5f2;--pill:#efefec;
  --y1:#ffd93b;--y1t:rgba(255,217,59,.78);--y2:#fff3a6;--y2t:rgba(255,243,166,.9);
  --hero1:#fff6c4;--hero2:#fffdf0;--heroline:#f5e8a8;
  --ok:#17824f;--okbg:#e0f5ea;--bad:#c4325a;--badbg:#ffe6ed;--star:#f0a500;
  --code:#faf9f4;--codefg:#34312a;--paper:#fffefb;--paperline:#d9d4c3;--rule:#e9e5d6;
  --btn:#ffd93b;--btnfg:#26241f;--shadow:0 1px 2px rgba(60,50,10,.06),0 8px 24px rgba(60,50,10,.07);
  --f-sans:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;--f-serif:'Noto Serif KR','AppleMyungjo','Batang','Nanum Myeongjo',serif;--f-mono:ui-monospace,'SF Mono',Menlo,Consolas,'D2Coding','Courier New',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412;--fg:#f3f0e6;--mute:#a09b8c;--line:#2f2d27;--card:#1f1e1a;--pill:#25241f;
  --y1:#f2c919;--y1t:rgba(255,214,0,.55);--y2:#6b5d10;--y2t:rgba(255,226,90,.26);
  --hero1:#34300f;--hero2:#1b1a12;--heroline:#4a4416;
  --ok:#74dba7;--okbg:#17332a;--bad:#ff9fb8;--badbg:#431f2c;--star:#ffc233;
  --code:#1b1a16;--codefg:#eee8d2;--paper:#1c1b17;--paperline:#3b3829;--rule:#2d2b22;
  --btn:#f2c919;--btnfg:#1d1b12;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412;--fg:#f3f0e6;--mute:#a09b8c;--line:#2f2d27;--card:#1f1e1a;--pill:#25241f;
  --y1:#f2c919;--y1t:rgba(255,214,0,.55);--y2:#6b5d10;--y2t:rgba(255,226,90,.26);
  --hero1:#34300f;--hero2:#1b1a12;--heroline:#4a4416;
  --ok:#74dba7;--okbg:#17332a;--bad:#ff9fb8;--badbg:#431f2c;--star:#ffc233;
  --code:#1b1a16;--codefg:#eee8d2;--paper:#1c1b17;--paperline:#3b3829;--rule:#2d2b22;
  --btn:#f2c919;--btnfg:#1d1b12;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:16px;min-width:0}
.wrap>*{min-width:0}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
/* hero */
.hero{display:flex;align-items:center;gap:14px;padding:22px 22px;border-radius:22px;background:linear-gradient(135deg,var(--hero1),var(--hero2));border:1px solid var(--heroline);position:relative}
.hico{flex:none;width:46px;height:46px;border-radius:14px;background:var(--y1);display:grid;place-items:center;color:#26241f}
.hlab{font-size:13px;color:var(--mute);font-weight:500}
.hero h1{font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.02em}
.u{background:linear-gradient(transparent 62%,var(--y1t) 62%);padding:0 2px}
.theme{margin-left:auto;flex:none;border:0;background:rgba(255,255,255,.55);width:36px;height:36px;border-radius:50%;font-size:16px}
:root[data-theme="dark"] .theme{background:rgba(255,255,255,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme{background:rgba(255,255,255,.1)}}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--pill);padding:5px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:500;color:var(--mute);white-space:nowrap;line-height:1.3}
.tab.on{background:var(--y1);color:#26241f;font-weight:700}
.tab.home{padding:8px 12px}
.desc{font-size:14px;color:var(--mute)}
.desc mark{padding:0 4px;border-radius:3px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl label{white-space:nowrap;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center;min-width:0;max-width:100%}.ctl select{min-width:0;max-width:100%;text-overflow:ellipsis}
select{font:inherit;font-size:16px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"],.chip.sel{background:var(--y1);border-color:var(--y1);color:#26241f;font-weight:700}
.chip.dn::after{content:" ✓";color:var(--ok);font-weight:700}
/* marks */
mark{color:inherit;border-radius:3px}
mark.y1{background:linear-gradient(transparent 12%,var(--y1t) 12%);padding:0 2px;font-weight:700}
mark.y2{background:var(--y2t);padding:0 2px}
mark.ink{background:var(--y1t);padding:0 1px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code);border:1px solid var(--line);padding:0 5px;border-radius:5px}
/* study */
.sec{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}.sec>*{min-width:0}
.sec>h3{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;margin-top:8px}
.sec>h3::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--y1)}
.sc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:14px 16px;min-width:0}
.sc .no{flex:none;min-width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--mute);margin-top:2px}
.sc .tx{flex:1;min-width:0;line-height:2}
.sc .st{flex:none;color:var(--star);font-size:14px;letter-spacing:-1px;margin-top:3px}
.qline{border:1.5px dashed var(--heroline);background:var(--hero2);border-radius:14px;padding:10px 14px;font-weight:700}
.blk{background:var(--card);border-radius:16px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.blk .bh{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;align-items:center}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:14.5px;background:var(--bg);border-radius:10px;overflow:hidden;line-height:1.6}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--pill);font-weight:700;white-space:nowrap}
pre{margin:0;font-family:var(--f-mono);font-size:13.5px;line-height:1.65;background:var(--code);color:var(--codefg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;max-width:100%;white-space:pre}
.note{font-size:14px;color:var(--mute)}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
.meter{height:8px;border-radius:8px;background:var(--pill);overflow:hidden}
.meter i{display:block;height:100%;background:var(--y1);border-radius:8px}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:6px}
/* buttons */
.btn{border:0;background:var(--btn);color:var(--btnfg);font-weight:700;border-radius:12px;padding:9px 18px;line-height:1.3}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.k{background:var(--okbg);color:var(--ok)}.btn.r{background:var(--badbg);color:var(--bad)}
.btn.big{padding:13px 26px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tag{display:inline-block;font-size:12.5px;padding:1px 10px;border-radius:999px;background:var(--pill);color:var(--mute);font-weight:500}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.mute{font-size:14px;color:var(--mute)}
/* home */
.homegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hbtn{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:26px 22px;min-height:150px;align-content:center}
.hbtn:hover{border-color:var(--y1)}
.hbtn b{font-size:22px;font-weight:800}.hbtn span{font-size:14px;color:var(--mute)}
.hbtn .e{font-size:30px}
.sub{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* inputs */
.fin{font:inherit;font-size:16px;border:0;border-bottom:2px solid var(--y1);background:var(--y2t);color:var(--fg);border-radius:6px 6px 0 0;padding:1px 6px;min-width:3em;max-width:100%}
.fin:focus{outline:2px solid var(--y1);outline-offset:1px}
.fin.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.fin.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.fx{font-size:13px;color:var(--ok);margin-left:4px;font-weight:700}
textarea,input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;max-width:100%}
textarea{min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:16px;line-height:1.7;tab-size:4}
textarea:focus,input[type=text]:focus,input[type=number]:focus{outline:2px solid var(--y1);border-color:var(--y1)}
/* czcard */
.cz{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:14px 16px;flex-wrap:wrap}
.cz .no{flex:none;min-width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--mute);margin-top:2px}
.cz .tx{flex:1 1 240px;min-width:0;line-height:2.3}
.cz.done{background:var(--okbg)}
.cz .acts{flex:none;display:flex;gap:6px;align-items:center}
/* practice cards */
.card{background:var(--card);border-radius:18px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.card.btnlike{text-align:left;border:1px solid var(--line);cursor:pointer}
.card.btnlike:hover{border-color:var(--y1)}
.card>*{min-width:0}
.card h3{font-size:18px}
.intro{white-space:pre-wrap;font-size:14.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.qs{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.q{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;min-width:0;grid-template-columns:minmax(0,1fr)}
.q>*{min-width:0;max-width:100%}
.qh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:500}
.qn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--y1);color:#26241f;font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.kd{font-size:12px;background:var(--pill);color:var(--mute);border-radius:999px;padding:0 8px}
.fields{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.fields label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.blankcode{line-height:2.1}
.ans{background:var(--hero2);border:1px solid var(--heroline);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.mine{white-space:pre-wrap;font-family:var(--f-mono);font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.miss{display:inline-block;font-size:12.5px;background:var(--badbg);color:var(--bad);border-radius:999px;padding:0 10px;margin:2px 4px 2px 0}
.msg{color:var(--bad);font-weight:700;font-size:14px}
.ord{display:grid;gap:6px}
.ord button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px}
.ord button:hover{border-color:var(--y1)}
.ord .picked{display:flex;gap:8px;align-items:flex-start;background:var(--y2t);border-radius:10px;padding:6px 12px}
.ord .picked.ok{background:var(--okbg)}.ord .picked.bad{background:var(--badbg)}
.mirror{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
.mirror .w{background:var(--badbg);color:var(--bad);text-decoration:underline wavy}
.trace{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
/* exam */
.lobby{display:grid;gap:14px}
.sheetbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pill);border:1px solid var(--line)}
.dot.on{background:var(--y1);border-color:var(--y1);transform:scale(1.25)}.dot.dn{background:var(--fg);opacity:.35}
.timer{font-family:var(--f-mono);font-weight:700;font-size:16px}.timer.warn{color:var(--bad)}
.paper{background:var(--paper);border:1px solid var(--paperline);border-radius:6px;box-shadow:var(--shadow);padding:22px 26px 26px;font-family:var(--f-serif);display:grid;gap:16px;min-width:0}
.paper>*{min-width:0}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--fg);padding-bottom:10px;font-size:14px;align-items:flex-end}
.ph .tt{font-size:20px;font-weight:700}
.ph .who{display:flex;gap:14px;color:var(--mute)}
.ph .who span{border-bottom:1px solid var(--mute);min-width:44px;display:inline-block;text-align:center}
.pq{display:grid;gap:6px}
.pq h2{font-size:19px;font-weight:700}
.pq h2 .pt{font-size:13px;font-weight:600;border:1px solid var(--fg);border-radius:4px;padding:0 6px;margin-left:6px}
.pq p{font-size:15px;white-space:pre-wrap}
.qrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-top:1px dashed var(--paperline)}
.qrow>*{min-width:0}
.ql{padding:14px 18px 14px 0;border-right:1px dashed var(--paperline);display:grid;gap:10px;align-content:start}
.qr{padding:14px 0 14px 18px;display:grid;gap:8px;align-content:start}
.ql .qt{font-size:15.5px;line-height:1.8}
.ql .qt b.n{margin-right:6px}
.ql pre,.ql table{font-size:13px}
.qr .lab{font-size:12.5px;color:var(--mute);font-family:var(--f-sans)}
.qr textarea{min-height:150px;background:repeating-linear-gradient(transparent,transparent 26px,var(--rule) 26px,var(--rule) 27px);line-height:27px;padding:2px 12px;border-radius:8px;border-color:var(--paperline)}
.qr .fin{width:100%;font-family:var(--f-sans)}
.qr label.al{display:flex;gap:8px;align-items:center;font-family:var(--f-sans);font-size:14.5px}
.bm{flex:none;display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border:1px solid var(--fg);border-radius:50%;font-size:12px;font-family:var(--f-sans);line-height:1;padding:0 1px;background:var(--bg)}
.ordshow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--f-sans)}
.ordshow .ob{border:1.5px solid var(--fg);background:var(--bg);border-radius:8px;padding:2px 12px;font-weight:700}
.ordshow .ob.pk{background:var(--y1);border-color:var(--y1);color:#26241f}
.pnext{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:3px double var(--fg);padding-top:14px;font-family:var(--f-sans)}
.score{font-size:46px;font-weight:800;line-height:1}
@media (max-width:760px){
  .qrow{grid-template-columns:minmax(0,1fr)}.ql{border-right:0;padding-right:0;border-bottom:1px dotted var(--paperline)}.qr{padding-left:0}
  .paper{padding:16px 16px 20px}.hero h1{font-size:22px}.hero{padding:16px}.homegrid{grid-template-columns:minmax(0,1fr)}.hbtn{min-height:0;padding:20px}
}
@media (max-width:600px){
  body{font-size:18px;line-height:1.75}
  .hero h1{font-size:25px}.hlab{font-size:14px}
  .tab{font-size:16.5px;padding:10px 16px}.chip{font-size:16px;padding:7px 15px}
  .desc,.mute,.note{font-size:15.5px}
  .sec>h3{font-size:21px}.sc .tx,.cz .tx{font-size:18px}.sc .no,.cz .no{min-width:30px;height:30px;font-size:14px}
  table{font-size:16px}pre{font-size:15px}code{font-size:.9em}
  .btn{font-size:17px;padding:12px 20px}.btn.big{font-size:18px}
  .fin{font-size:17px;padding:3px 7px}.fx{font-size:15px}
  .qh,.fields label,.qr label.al{font-size:17px}.qr .lab{font-size:14.5px}.ql .qt{font-size:17.5px}
  .paper{font-size:17px}.pq h2{font-size:21px}.pq p{font-size:16.5px}
  textarea{font-size:16.5px}select{font-size:17px}
  .tag{font-size:14px}.kd{font-size:13px}.hbtn b{font-size:24px}.hbtn span{font-size:16px}
  .bm{font-size:14px}.timer{font-size:18px}
}
</style>

<div class="wrap" id="root"></div>
<script>
try{const sw=screen.width,iw=window.innerWidth;if(sw<=520&&iw>sw*1.4){document.documentElement.style.zoom=iw/sw}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num=n=>'re:(^|[^0-9])'+n+'([^0-9]|$)';
let store={pg:{},hist:[],wrong:{},hl:{},cp:{},cz:{}};
try{const r=localStorage.getItem('dcdp3');if(r)Object.assign(store,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('dcdp3',JSON.stringify(store))}catch(e){}};
try{const th=localStorage.getItem('dcdp-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
const TOPICS=[
 {id:'merge',u:'dc',n:'병합 정렬',e:'🥞'},{id:'sum',u:'dc',n:'리스트 합·개수',e:'🧮'},{id:'max',u:'dc',n:'최댓값·최솟값',e:'🏆'},
 {id:'sorted',u:'dc',n:'정렬 여부 확인',e:'🔍'},{id:'pow',u:'dc',n:'거듭제곱(2ⁿ)',e:'🚀'},{id:'bs',u:'dc',n:'이진 탐색',e:'🎯'},
 {id:'fib',u:'dp',n:'피보나치',e:'🌀'},{id:'grid',u:'dp',n:'격자 경로 수',e:'🗺️'},{id:'calls',u:'dp',n:'호출 횟수',e:'📞'},
 {id:'memo',u:'dp',n:'하향식(메모)',e:'📝'},{id:'bu',u:'dp',n:'상향식(표 채우기)',e:'🧱'},{id:'cmp',u:'dp',n:'DC vs DP 비교',e:'⚖️'}
];

/* ====== 수업 정리 (노트북 6·7 전체) ======
 마크업: [[핵심 용어]] = 진한 노랑, {{빈칸 후보}} = 연한 노랑, @@코드@@ = 인라인 코드
 imp: 0 보통 / 1 ★ 중요 / 2 ★★ 시험 단골 */
const S=(i,x)=>({k:'s',i,x});

function norm(s){return String(s==null?'':s).toLowerCase().replace(/[\s‘’“”'"]+/g,'').replace(/＝/g,'=')}
function nz(s){return norm(s).replace(/[\[\]]/g,'').replace(/,/g,'').replace(/(번|개|회)$/,'')}
function eqAns(user,ans){return ans.split('|').some(a=>nz(a)===nz(user))}
function autoCheck(part,text){
  const n=norm(text);if(!n)return null;const ok=part.ok||[];
  return ok.every(g=>g.some(nd=>nd.startsWith('re:')?new RegExp(nd.slice(3)).test(n):n.includes(norm(nd))));
}
function parseBlanks(code){
  const segs=[];let last=0;const re=/\{\{(.+?)\}\}/g;let m;
  while((m=re.exec(code))){segs.push({t:'t',v:code.slice(last,m.index)});segs.push({t:'b',a:m[1]});last=re.lastIndex}
  segs.push({t:'t',v:code.slice(last)});return segs;
}
function blanksOf(pt){
  if(pt.k==='num')return pt.fields.map(f=>f[1]);
  if(pt.k==='blank')return parseBlanks(pt.code).filter(s=>s.t==='b').map(s=>s.a);
  if(pt.k==='table'){const o=[];pt.rows.forEach(r=>r.forEach(c=>parseBlanks(c).forEach(s=>{if(s.t==='b')o.push(s.a)})));return o}
  return [];
}

function hilite(text,groups){
  const idx=[],ch=[];
  for(let i=0;i<text.length;i++){const c=text[i];if(/[\s‘’“”'"]/.test(c))continue;ch.push(c.toLowerCase());idx.push(i)}
  const nt=ch.join(''),rng=[],miss=[];
  (groups||[]).forEach(g=>{
    let hit=false;
    g.forEach(nd=>{
      if(nd.startsWith('re:')){const m=new RegExp(nd.slice(3)).exec(nt);if(m){hit=true;const st=m.index+m[1].length,len=m[0].length-m[1].length-(m[2]||'').length;if(len>0)rng.push([idx[st],idx[st+len-1]+1])}}
      else{const q=norm(nd);if(!q)return;const p=nt.indexOf(q);if(p>=0){hit=true;rng.push([idx[p],idx[p+q.length-1]+1])}}
    });
    if(!hit)miss.push(g[0].startsWith('re:')?g[0].replace(/^re:.*\]\)?/,'').replace(/\D/g,'')||'숫자':g[0]);
  });
  rng.sort((a,b)=>a[0]-b[0]);const merged=[];
  rng.forEach(r=>{const l=merged[merged.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else merged.push(r.slice())});
  let h='',p=0;merged.forEach(r=>{h+=esc(text.slice(p,r[0]))+'<mark class="ink">'+esc(text.slice(r[0],r[1]))+'</mark>';p=r[1]});
  return {html:h+esc(text.slice(p)),miss};
}
function modelText(pt){

    case 'table':return (pt.head?pt.head.join(' | ')+'\n':'')+pt.rows.map(r=>r.map(c=>c.replace(/\{\{(.+?)\}\}/g,(m,a)=>a.split('|')[0])).join(' | ')).join('\n');
    case 'tf':return (pt.ans?'○ 맞다':'✕ 틀리다')+' — '+pt.a;
    case 'order':return pt.steps.map((s,i)=>(i+1)+'. '+s).join('\n');
    default:return pt.a;
  }
}

function labFib(){const n=Math.max(1,Math.min(30,+$('#fibN').value||1));const dp=[0,1,1];for(let i=3;i<=n;i++)dp[i]=dp[i-1]+dp[i-2];
  $('#fibOut').innerHTML=`<ul><li>f(${n}) = <b>${fibVal(n)}</b></li><li>메모 없는 재귀 호출 횟수: <b>${fibCalls(n)}</b> (c(n) = 1 + c(n-1) + c(n-2))</li><li>하향식(메모) 호출 횟수: <b>${fibMemoCalls(n)}</b></li><li>상향식 점화식 실행 횟수: <b>${Math.max(0,n-2)}</b></li></ul><div class="trace">dp = [${dp.slice(1,n+1).join(', ')}]  (dp[1]부터)</div>`}
function labGrid(){
  const R=Math.max(1,Math.min(8,+$('#gR').value||1)),C=Math.max(1,Math.min(8,+$('#gC').value||1));
  const bl=new Set(($('#gB').value.match(/\d+\s*,\s*\d+/g)||[]).map(s=>s.replace(/\s/g,'')));
  const dp=[];for(let i=0;i<R;i++){dp.push([]);for(let j=0;j<C;j++){dp[i][j]=bl.has(i+','+j)?0:(i===0&&j===0)?1:(i?dp[i-1][j]:0)+(j?dp[i][j-1]:0)}}
  let extra='';
  if(!bl.size){const cd=Array.from({length:R},()=>Array(C).fill(0));const f=(r,c)=>{cd[r][c]++;if(r===0&&c===0)return;if(r>0)f(r-1,c);if(c>0)f(r,c-1)};f(R-1,C-1);
    extra=`<p>적어 두지 않을 때 호출 횟수: <b>${gCalls(R-1,C-1)}</b> · 동적 표(하향식) 호출 횟수: <b>${gMemoCalls(R,C)}</b> · 상향식 채운 칸: <b>${R*C}</b></p><div class="mute">called 표 (칸마다 호출된 횟수)</div><div class="tw"><table>${cd.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>`}
  $('#gridOut').innerHTML=`<div class="mute">P(r, c) 표</div><div class="tw"><table>${dp.map((r,i)=>`<tr>${r.map((v,j)=>`<td${bl.has(i+','+j)?' style="background:var(--badbg)"':''}>${v}</td>`).join('')}</tr>`).join('')}</table></div><p>도착 칸의 길의 수: <b>${dp[R-1][C-1]}</b></p>`+extra}
function labPw(){const n=Math.max(1,Math.min(100000,+$('#pwN').value||1));
  $('#pwOut').innerHTML=`<ul><li>① power_one(${n}) 곱셈: <b>${n}</b>번</li><li>② power_both(${n}) 곱셈: <b>${n-1}</b>번</li><li>③ power_half(${n}) 곱셈: <b>${pHalf(n)[1]}</b>번</li></ul>`}
function labBS(){const a=$('#bsA').value.split(',').map(s=>s.trim()).filter(Boolean).map(Number),t=+$('#bsT').value;let lo=0,hi=a.length-1,out='',n=0;
  while(n<60){n++;if(lo>hi){out+=`호출 ${n}: lo=${lo}, hi=${hi} → lo > hi, -1 반환\n`;break}
    const mid=Math.floor((lo+hi)/2);out+=`호출 ${n}: lo=${lo}, hi=${hi}, mid=${mid}, A[mid]=${a[mid]}`;
    if(a[mid]===t){out+=` → 찾음! ${mid} 반환\n`;break}

  $('#bsOut').innerHTML=`<div class="trace">${esc(out)}</div>`}
function labMS(){const a=$('#msA').value.split(',').map(s=>s.trim()).filter(Boolean).map(Number).slice(0,8),log=[];
  const ms=(x,d)=>{const p='  '.repeat(d);log.push(p+'분할 ['+x.join(', ')+']');if(x.length<=1){log.push(p+'  → 원소 '+x.length+'개: 그대로 반환');return x}
    const m=Math.floor(x.length/2),l=ms(x.slice(0,m),d+1),r=ms(x.slice(m),d+1),res=[];let i=0,j=0;while(i<l.length&&j<r.length)res.push(l[i]<=r[j]?l[i++]:r[j++]);

    return hero()+`<div class="bar sheetbar"><div class="dots">${ex.items.map((_,i)=>`<span class="dot${i<ex.cur?' dn':i===ex.cur?' on':''}"></span>`).join('')}<span class="mute">&nbsp;${ex.cur+1} / ${ex.items.length}</span></div><span class="timer" id="timer">${ex.end?'--:--':'∞'}</span></div>
    <article class="paper"><div class="ph"><div><div class="tt">수행평가 ${UN[ex.u]} 모의시험</div><div class="mute">${ex.end?exT+'분':'시간 제한 없음'} · ${ex.items.length}문제 · ${pts}점</div></div><div class="who">반<span></span> 번호<span></span> 이름<span></span></div></div>
    <div class="pq"><h2>문제 ${ex.cur+1}. ${esc(p.title)}<span class="pt">${p.parts.length}점</span></h2><p>${esc(p.intro)}</p></div>
    ${p.parts.map((_,i)=>examPart(p,i)).join('')}
    <div class="pnext"><span class="mute">${last?'마지막 문제예요. 제출하면 수정할 수 없어요.':'다음으로 넘어가면 이 문제로 돌아올 수 없어요.'}</span>${last?(ex.confirm?`<span class="row"><button class="btn g" data-act="exCancel">더 쓸래요</button><button class="btn big" data-act="exSubmit">정말 제출</button></span>`:`<button class="btn big" data-act="exAsk">답안 제출</button>`):`<button class="btn big" data-act="exNext">다음 문제 →</button>`}</div></article>`;
  }
  const sc=exScore(),mx=ex.items.reduce((a,q)=>a+q.parts.length,0);
  return hero()+tabsBar('')+`<div class="card" style="background:var(--hero2)"><div class="row sp"><div><h3>채점 결과</h3><p class="desc">자동 판정이 반영됐어요. 서술·코드는 모범 답안과 비교해 ○/✕를 직접 고쳐 보세요.</p></div><div class="score">${sc}<span class="mute" style="font-size:20px"> / ${mx}</span></div></div><div class="row"><button class="btn" data-act="exAgain">같은 범위 다시</button><button class="btn g" data-act="exEnd">로비로</button><button class="btn g" data-act="go" data-v="notes">📒 오답노트</button></div></div>`
    +ex.items.map((p,i)=>probHTML('ex',p,'review','문제 '+(i+1)+'.')).join('');
}
function tick(){const el=$('#timer');if(!el||!ex||ex.phase!=='run'||!ex.end)return;
  const left=Math.max(0,Math.ceil((ex.end-Date.now())/1000));el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  el.classList.toggle('warn',left<=300);if(left<=0)exSubmit()}
function exSubmit(){
  if(!ex||ex.phase!=='run')return;clearInterval(timerId);ex.phase='done';ex.confirm=false;
  ex.items.forEach(p=>p.parts.forEach((pt,i)=>{const key='ex|'+p.id+'|'+i;GR[key]=autoGrade(pt,key)?1:0;
    const g=store.pg[p.id]||[null,null,null];g[i]=GR[key];store.pg[p.id]=g;
    if(GR[key]===0)store.wrong[p.id+':'+i]={t:Date.now(),a:ansText(key,pt)};else delete store.wrong[p.id+':'+i]}));
  store.hist.push({t:Date.now(),u:ex.u,score:exScore(),max:ex.items.reduce((a,q)=>a+q.parts.length,0)});ex.hid=store.hist.length-1;save();render();window.scrollTo(0,0)}
function exStart(){clearInterval(timerId);
  [ANS,INP,GR,CHK,ORDSH,MSG].forEach(o=>Object.keys(o).filter(k=>k.startsWith('ex|')).forEach(k=>delete o[k]));
  ex={u:exU,items:pickExam(exU),cur:0,phase:'run',end:exT?Date.now()+exT*60000:null,confirm:false};
  if(exT)timerId=setInterval(tick,1000);render();window.scrollTo(0,0)}

/* ---- 라우팅·렌더 ---- */
const VF={home:()=>hero()+vHome(),study:()=>({read:vRead,cloze:vCloze,copy:vCopy,practice:vPractice,lab:vLab})[sTab](),exam:vExam,notes:vNotes};
function render(){
  $('#root').innerHTML=VF[view]();
  if(view==='study'&&sTab==='lab')labAll();
  if(view==='study'&&sTab==='copy')updMirror();
  if(view==='exam')tick();
}
function setView(v){view=v;try{if(location.hash!=='#'+v)location.hash=v}catch(e){}render();window.scrollTo(0,0)}
function applyHL(){
  if(!HL)return;const sel=getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return;
  const r=sel.getRangeAt(0),n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement,box=el&&el.closest('.hlable');if(!box)return;
  const mk=document.createElement('mark');mk.className='ink';
  try{r.surroundContents(mk)}catch(e){try{mk.appendChild(r.extractContents());r.insertNode(mk)}catch(_){return}}
  sel.removeAllRanges();store.hl[box.dataset.hk]=box.innerHTML;save();
}

/* ---- 이벤트 ---- */
function resetPart(key){delete CHK[key];delete GR[key];delete MSG[key]}
function czCheckKeys(keys){keys.forEach(k=>{const st=CZ[k]||(CZ[k]={v:[],chk:false});st.chk=true;const A=CZI[k]||[];
  if(A.length&&A.every((a,i)=>eqAns((st.v||[])[i]||'',a)))store.cz[k]=1});save();render()}
document.addEventListener('click',e=>{
  const mk=e.target.closest('mark.ink');
  if(mk&&HL&&mk.closest('.hlable')){const box=mk.closest('.hlable');mk.replaceWith(...mk.childNodes);box.normalize();store.hl[box.dataset.hk]=box.innerHTML;save();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,key=b.dataset.key;
  if(a==='theme'){const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const nx=dark?'light':'dark';document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem('dcdp-theme',nx)}catch(_){}return}
  if(a==='go'){if(b.dataset.v==='exam'&&ex&&ex.phase!=='run'){}setView(b.dataset.v);return}
  if(a==='sTab'){sTab=b.dataset.v;if(view!=='study')view='study';render();window.scrollTo(0,0);return}
  if(a==='studyU'){studyU=b.dataset.u;rangeSel='all';topic=null;pset=null;cpSel=null;render();return}
  if(a==='pickTopic'){topic=b.dataset.t;pset=null;render();return}
  if(a==='pset'){pset=b.dataset.id;render();return}
  if(a==='practiceTopic'){topic=b.dataset.t;studyU=tname(topic).u;pset=b.dataset.id||null;sTab='practice';setView('study');return}
  if(a==='hint'){HNT[key]=true;render();return}
  if(a==='check'){const [,pid,i]=key.split('|');const pt=PR.find(x=>x.id===pid).parts[+i];
    if(FUZ(pt.k)&&pt.k!=='tf'&&!(ANS[key]||'').trim()){MSG[key]='먼저 직접 써 본 다음에 채점할 수 있어요!';render();return}
    if(pt.k==='tf'&&!(INP[key]||[])[0]){MSG[key]='○ 또는 ✕ 를 먼저 골라 주세요.';render();return}
    delete MSG[key];CHK[key]=true;setGrade(key,autoGrade(pt,key)?1:0);render();return}
  if(a==='retry'){resetPart(key);if(PR.find(x=>x.id===key.split('|')[1]).parts[+key.split('|')[2]].k==='order')INP[key]=[];render();return}
  if(a==='grade'){setGrade(key,+b.dataset.v);render();return}
  if(a==='tf'){INP[key][0]=b.dataset.v;delete MSG[key];render();return}
  if(a==='ord'){INP[key].push(+b.dataset.o);render();return}
  if(a==='ordundo'){INP[key].pop();render();return}
  if(a==='ordreset'){INP[key]=[];render();return}
  if(a==='hltoggle'){HL=!HL;render();return}
  if(a==='hlclear'){Object.keys(store.hl).filter(k=>k.startsWith(studyU+':')).forEach(k=>delete store.hl[k]);save();render();return}
  if(a==='czCore'){czCore=!czCore;render();return}
  if(a==='czOnly'){czOnly=!czOnly;render();return}
  if(a==='czCheck'){czCheckKeys([b.dataset.k]);return}
  if(a==='czAllChk'){czCheckKeys(Object.keys(CZI).filter(k=>k.startsWith(studyU+':')&&document.querySelector('[data-cz="'+k+'"]')));return}
  if(a==='czReset'){Object.keys(store.cz).filter(k=>k.startsWith(studyU+':')).forEach(k=>delete store.cz[k]);Object.keys(CZ).filter(k=>k.startsWith(studyU+':')).forEach(k=>delete CZ[k]);save();render();return}
  if(a==='cpPick'){cpSel=b.dataset.id;cpChecked=false;render();return}
  if(a==='cpMode'){cpMode=b.dataset.v;cpChecked=false;render();return}
  if(a==='cpCheck'){cpChecked=true;const cur=SNIP.find(s=>s.id===cpSel),r=cmpLines(cur,CPT[cur.id]||''),pct=Math.round(100*r.ok/r.total);if(cpMode==='blind'||pct===100)store.cp[cur.id]=Math.max(store.cp[cur.id]||0,pct);save();render();return}
  if(a==='cpClear'){CPT[cpSel]='';cpChecked=false;render();return}
  if(a==='exU'){exU=b.dataset.u;if(exT)exT=exU==='mix'?50:25;render();return}
  if(a==='exT'){exT=+b.dataset.v;render();return}
  if(a==='exStart'||a==='exAgain'){exStart();return}
  if(a==='exNext'){ex.cur++;ex.confirm=false;render();window.scrollTo(0,0);return}
  if(a==='exAsk'){ex.confirm=true;render();return}
  if(a==='exCancel'){ex.confirm=false;render();return}
  if(a==='exSubmit'){exSubmit();return}
  if(a==='exEnd'){clearInterval(timerId);ex=null;render();window.scrollTo(0,0);return}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset||{};
  if(d.cp){CPT[d.cp]=t.value;cpChecked=false;updMirror();return}
  if(d.cz){const st=CZ[d.cz]||(CZ[d.cz]={v:[],chk:false});st.v[+d.i]=t.value;return}
  if(d.key){if(d.i!=null){INP[d.key][+d.i]=t.value}else ANS[d.key]=t.value;return}
  if(t.id==='fibN')labFib();else if(t.id==='gR'||t.id==='gC'||t.id==='gB')labGrid();else if(t.id==='pwN')labPw();else if(t.id==='bsA'||t.id==='bsT')labBS();else if(t.id==='msA')labMS()});
document.addEventListener('change',e=>{const t=e.target,s=t.dataset&&t.dataset.sel;
  if(s==='range'){rangeSel=t.value;render()}else if(s==='star'){starSel=+t.value;render()}});
document.addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='Tab'&&t.tagName==='TEXTAREA'){e.preventDefault();t.setRangeText('    ',t.selectionStart,t.selectionEnd,'end');
    if(t.dataset.cp){CPT[t.dataset.cp]=t.value;cpChecked=false;updMirror()}else if(t.dataset.key)ANS[t.dataset.key]=t.value}
  if(e.key==='Enter'&&t.dataset&&t.dataset.cz){const f=[...document.querySelectorAll('[data-cz="'+t.dataset.cz+'"]')];const i=f.indexOf(t);if(i<f.length-1)f[i+1].focus();else czCheckKeys([t.dataset.cz])}});
document.addEventListener('mouseup',()=>setTimeout(applyHL,0));
document.addEventListener('touchend',()=>setTimeout(applyHL,50));
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VF[v]&&v!==view){view=v;render();window.scrollTo(0,0)}});
{const v=location.hash.slice(1);if(VF[v])view=v}
render();
</script>

</body>
